name: Feature request
description: Suggest a new feature or a change.
type: Feature
body:
  - type: textarea
    id: task
    attributes:
      label: What you want to do
      description: The task in TouchDesigner and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you see it
      description: Your idea of the solution, if you have one.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - MCP and agents
        - Plugin
        - Extension
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Examples, links, screenshots.
