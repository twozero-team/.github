name: Bug report
description: Something in the plugin, MCP or an extension does not work as it should.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Update the plugin first (**Settings > Check updates**) and search the open issues: the bug may already be fixed or reported.

        Security problem? Do not post it here. Report it privately, see the [security policy](https://github.com/twozero-team/.github/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Ask the agent ...
        3. See ...
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Shown in Settings in the TWOZERO window.
      placeholder: "3.xxx"
    validations:
      required: true
  - type: input
    id: td-build
    attributes:
      label: TouchDesigner build
      description: Help > About TouchDesigner.
      placeholder: "2025.xxxxx"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Other
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      description: Which agent you were using, if any.
      multiple: true
      options:
        - Claude Code
        - Claude Desktop
        - Cursor
        - Codex
        - Other
        - No agent involved
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Textport output, the agent's error message, screenshots. Drag files here.
